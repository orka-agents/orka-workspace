# Requirements copied from the unmodified official Substrate kind cluster
# creator (hack/create-kind-cluster.sh) at v1.0.0,
# b34fbee742906494b5eb4f1f36987176bf8770a4. This is a dedicated kindctl
# --tag external-substrate cluster; never apply these settings to another cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  certificates.k8s.io/v1beta1: "true"
networking:
  ipFamily: ipv4
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 4
