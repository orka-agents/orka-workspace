# Requirements copied from the unmodified official Substrate cluster installer
# at fa6d949685a6318940a9a0195c867c864009b820. This is a dedicated kindctl
# --tag external-substrate cluster; never apply these settings to another cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  certificates.k8s.io/v1beta1: "true"
networking:
  ipFamily: ipv4
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 4
