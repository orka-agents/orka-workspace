# kagent baseline cluster (kindctl --tag kagent-baseline). It carries the same
# Agent Substrate v1.0.0 kind requirements as hack/external-substrate-e2e/cluster.yaml
# (pod certificate and trust bundle feature gates), plus longer kubeadm
# timeouts for a busy host. Never apply it to another cluster. Only kindctl
# creates it; kagent's and Substrate's kind scripts reuse the shared
# kind-registry and are not run.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  certificates.k8s.io/v1beta1: "true"
networking:
  ipFamily: ipv4
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 4
  - |
    kind: InitConfiguration
    timeouts:
      controlPlaneComponentHealthCheck: 10m0s
      kubeletHealthCheck: 10m0s
      kubernetesAPICall: 5m0s
