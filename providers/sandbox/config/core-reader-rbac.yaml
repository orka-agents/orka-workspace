apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-workspace-sandbox-provider-config-reader
  labels:
    workspace.orka.ai/aggregate-to-provider-config-reader: "true"
rules:
  - apiGroups: [sandbox.workspace.orka.ai]
    resources: [sandboxproviderconfigs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-workspace-sandbox-profile-reader
  labels:
    workspace.orka.ai/aggregate-to-parameter-reader: "true"
rules:
  - apiGroups: [sandbox.workspace.orka.ai]
    resources: [sandboxworkspaceprofiles]
    verbs: [get, list, watch]
