apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-workspace-sandbox
rules:
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaces]
    verbs: [patch]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders, executionworkspaceclasses, executionworkspacepools, executionworkspaces]
    verbs: [get, list, watch]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders/status, executionworkspacepools/status, executionworkspaces/status]
    verbs: [get, patch, update]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders]
    resourceNames: [sandbox]
    verbs: [provider-status]
  - apiGroups: [sandbox.workspace.orka.ai]
    resources: [sandboxproviderconfigs, sandboxworkspaceprofiles]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims, sandboxwarmpools, sandboxtemplates]
    verbs: [get, create, update, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, update, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orka-workspace-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orka-workspace-sandbox
subjects:
  - kind: ServiceAccount
    name: orka-workspace-sandbox
    namespace: orka-workspace-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-workspace-sandbox-leader
  namespace: orka-workspace-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-workspace-sandbox-leader
  namespace: orka-workspace-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orka-workspace-sandbox-leader
subjects:
  - kind: ServiceAccount
    name: orka-workspace-sandbox
    namespace: orka-workspace-system
