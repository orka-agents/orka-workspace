apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-workspace-fiberd
rules:
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders, executionworkspaceclasses, executionworkspacepools, executionworkspaces]
    verbs: [get, list, watch]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaces]
    verbs: [patch]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders/status, executionworkspacepools/status, executionworkspaces/status]
    verbs: [get, patch, update]
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceproviders]
    resourceNames: [fiberd]
    verbs: [provider-status]
  - apiGroups: [fiberd.workspace.orka.ai]
    resources: [fiberdproviderconfigs, fiberdpoolparameters]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orka-workspace-fiberd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orka-workspace-fiberd
subjects:
  - kind: ServiceAccount
    name: orka-workspace-fiberd
    namespace: orka-workspace-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-workspace-fiberd-leader
  namespace: orka-workspace-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-workspace-fiberd-leader
  namespace: orka-workspace-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orka-workspace-fiberd-leader
subjects:
  - kind: ServiceAccount
    name: orka-workspace-fiberd
    namespace: orka-workspace-system
