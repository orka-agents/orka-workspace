apiVersion: v1
kind: Namespace
metadata:
  name: orka-workspace-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orka-workspace-fiberd
  namespace: orka-workspace-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orka-workspace-fiberd
  namespace: orka-workspace-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orka-workspace-fiberd
  template:
    metadata:
      labels:
        app: orka-workspace-fiberd
    spec:
      serviceAccountName: orka-workspace-fiberd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: orka-workspace-fiberd:dev
          args:
            - --leader-elect=true
            - --leader-election-namespace=orka-workspace-system
            # The fiberd home and the issuer key its grants verify against.
            - --home-namespace=tenant-a
            - --home-pod=orka-home-grant
            - --issuer-key-file=/var/run/fiberd/issuer/key.json
            - --issuer-url=http://grant-issuer.fiberd-system.svc:8080
            # The pinned supervisor image the home's gVisor rootfs is built from.
            - --supervisor-images=SUPERVISOR_IMAGE
          volumeMounts:
            - name: issuer
              mountPath: /var/run/fiberd/issuer
              readOnly: true
          ports:
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: issuer
          secret:
            secretName: fiberd-issuer-key
