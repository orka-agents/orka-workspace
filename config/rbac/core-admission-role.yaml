# Add this virtual-verb grant to the existing core controller's ordinary RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-core-admission
rules:
- apiGroups: [workspace.orka.ai]
  resources: [executionworkspaceproviders, executionworkspaceclasses, executionworkspacepools, executionworkspaces, executionworkspacecheckpoints]
  verbs: [admit]
