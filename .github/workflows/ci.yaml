name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            providers/go.sum
      - name: Install envtest assets
        # The CRD install test runs the generated CRDs through a real
        # kube-apiserver, so CEL rule cost is checked as on a cluster.
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3 use 1.37.0 --bin-dir "$RUNNER_TEMP/envtest" -p path)" >> "$GITHUB_ENV"
      - run: make check
